services:
  owl:
    image: ${OWL_IMAGE:-mugglejinx/owl:latest}
    volumes:
      - ./proxmox.env:/app/owl/.env
      - ../examples:/app/examples:ro
      - owl-data:/app/owl/data
      - pip-cache:/root/.pip/cache
      - playwright-cache:/root/.cache/ms-playwright
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_API_BASE_URL=${QWEN_API_BASE_URL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE_URL=${DEEPSEEK_API_BASE_URL:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_API_BASE_URL=${GROQ_API_BASE_URL:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_BASE_URL=${AZURE_OPENAI_BASE_URL:-}
      - AZURE_API_VERSION=${AZURE_API_VERSION:-}
      - AZURE_DEPLOYMENT_NAME=${AZURE_DEPLOYMENT_NAME:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - SEARCH_ENGINE_ID=${SEARCH_ENGINE_ID:-}
      - CHUNKR_API_KEY=${CHUNKR_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - FIRECRAWL_API_URL=${FIRECRAWL_API_URL:-}
      - DISPLAY=:99
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - TERM=xterm-256color
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - PYTHONPATH=.
    ports:
      - "7860:7860"
    command: ["xvfb-python", "webapp.py"]
    stdin_open: true
    tty: true
    shm_size: 2gb
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:7860', timeout=5).read(1)\nPY
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - proxmox-network

volumes:
  owl-data:
  pip-cache:
  playwright-cache:

networks:
  proxmox-network:
    driver: bridge
